name: Deploy to Xserver

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SFTP
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          sudo apt-get install -y lftp sshpass
          USER_CLEAN=$(echo -n "$FTP_USER" | tr -d '\n\r')
          PASS_CLEAN=$(echo -n "$FTP_PASS" | tr -d '\n\r')
          export SSHPASS="$PASS_CLEAN"
          lftp -d \
            -e "set sftp:connect-program 'sshpass -e ssh -a -x -o StrictHostKeyChecking=no'; open -u $USER_CLEAN sftp://sv10868.xserver.jp:10022; ls; mirror -R --delete AmisterStats/ /xs228925/xs228925.xsrv.jp/public_html/AmisterStats/; quit"
