name: Deploy to Xserver

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SFTP
        env:
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          sudo apt-get install -y lftp
          lftp -d -c "
            set sftp:auto-confirm yes;
            set net:timeout 30;
            set net:max-retries 3;
            open -u ${{ secrets.FTP_USER }},$FTP_PASS sftp://sv10868.xserver.jp:10022;
            ls;
            mirror -R --delete AmisterStats/ /xs228925/xs228925.xsrv.jp/public_html/AmisterStats/;
            quit
          "
